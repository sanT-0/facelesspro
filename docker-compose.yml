services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: facelesspro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: faceless
      POSTGRES_PASSWORD: faceless
      POSTGRES_DB: faceless
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceless -d faceless"]
      interval: 5s
      timeout: 3s
      retries: 20

  # API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: facelesspro-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://faceless:faceless@postgres:5432/faceless
      PGBOSS_SCHEMA: pgboss
      DATA_DIR: /data
      # Interpolated from .env. Use the origin clients actually open: it is used
      # for `editorUrl` and for the absolute, unauthenticated render URL, and the
      # studio's nginx proxies /v1/* and /files/* to this api.
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:3003}"
      MEDIA_SERVICE_URL: http://media:8000
      RATE_LIMIT_KEY_PER_MINUTE: "${RATE_LIMIT_KEY_PER_MINUTE:-60}"
      RATE_LIMIT_WORKSPACE_PER_MINUTE: "${RATE_LIMIT_WORKSPACE_PER_MINUTE:-300}"
    ports:
      - "3001:3001"
    volumes:
      - data:/data
      # The media service returns absolute `master_mp3_path`s; the worker reads
      # that file directly, so both containers must see it at the same path.
      - media-data:/data/media:ro
    depends_on:
      postgres:
        condition: service_healthy
      media:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Worker (background job processor)
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: facelesspro-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://faceless:faceless@postgres:5432/faceless
      PGBOSS_SCHEMA: pgboss
      DATA_DIR: /data
      MEDIA_SERVICE_URL: http://media:8000
      HEALTH_PORT: 9090
      # Consume the pipeline steps + webhooks, but never `render`: the `render`
      # service owns that queue. See serviceRole() in apps/worker/src/main.ts.
      RENDER_SERVICE: "worker"
      # --- engine chains (interpolated from the repo-root .env) ---------------
      # First healthy adapter wins, left to right. A provider with no
      # credentials is skipped with a warning and the chain continues; the
      # trailing heuristic/procedural adapters need nothing and always answer.
      PLANNER: "${PLANNER:-cloudflare,groq,ollama,heuristic}"
      PLANNER_DESCRIBE: "${PLANNER_DESCRIBE:-}"
      IMAGE: "${IMAGE:-cloudflare,pollinations,comfyui,procedural}"
      STYLE: "${STYLE:-cloudflare,gemini,heuristic}"
      # --- provider credentials (empty = skip that provider) ------------------
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      POLLINATIONS_API_KEY: "${POLLINATIONS_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # Ollama/ComfyUI usually run on the host. Inside a container 127.0.0.1 is
      # the container itself, so these default to the host gateway. Override
      # with the *_DOCKER names when the service runs on the compose network.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}"
      OLLAMA_PLANNER_MODEL: "${OLLAMA_PLANNER_MODEL:-}"
      OLLAMA_DESCRIBE_MODEL: "${OLLAMA_DESCRIBE_MODEL:-}"
      COMFYUI_URL: "${COMFYUI_URL_DOCKER:-http://host.docker.internal:8188}"
      COMFYUI_WORKFLOW: "${COMFYUI_WORKFLOW:-}"
      COMFYUI_OUTPUT_NODE: "${COMFYUI_OUTPUT_NODE:-}"
      COMFYUI_TIMEOUT_MS: "${COMFYUI_TIMEOUT_MS:-}"
      # --- optional signing / logging -----------------------------------------
      # When empty the X-Faceless-Signature header is omitted, not forged.
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_SCRIPTS: "${LOG_SCRIPTS:-0}"
    # Lets the container reach a host-run Ollama/ComfyUI via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/data
      # The media service returns absolute `master_mp3_path`s; the worker reads
      # that file directly, so both containers must see it at the same path.
      - media-data:/data/media:ro
    depends_on:
      postgres:
        condition: service_healthy
      media:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Media Service (TTS/ASR)
  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    container_name: facelesspro-media
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      MEDIA_DATA_DIR: /data/media
      MEDIA_SERVICE_URL: http://0.0.0.0:8000
      # TTS chain interpolated from the repo-root .env. Azure is the licensed
      # production path; a public deployment sets TTS_REQUIRE_LICENSED=1, which
      # drops `edge` and refuses to start without a licensed engine.
      TTS: "${TTS:-edge,azure,indicf5,piper}"
      TTS_REQUIRE_LICENSED: "${TTS_REQUIRE_LICENSED:-0}"
      AZURE_SPEECH_KEY: "${AZURE_SPEECH_KEY:-}"
      AZURE_SPEECH_REGION: "${AZURE_SPEECH_REGION:-}"
      # Pinned for the container's verified caption timing. Host runs read these
      # from .env; changing them changes narration pauses, so re-run the
      # listening gate if you do.
      TTS_PAUSE_COMPRESSION: "true"
      TTS_SENTENCE_PAUSE_MS: "150"
    ports:
      - "8000:8000"
    volumes:
      - media-data:/data/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Render Service (dedicated render worker)
  render:
    build:
      context: .
      dockerfile: apps/render/Dockerfile
    container_name: facelesspro-render
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://faceless:faceless@postgres:5432/faceless
      PGBOSS_SCHEMA: pgboss
      DATA_DIR: /data
      MEDIA_SERVICE_URL: http://media:8000
      RENDER_SERVICE: "true"
      HEALTH_PORT: 9091
    volumes:
      - data:/data
      # The media service returns absolute `master_mp3_path`s; the worker reads
      # that file directly, so both containers must see it at the same path.
      - media-data:/data/media:ro
    depends_on:
      postgres:
        condition: service_healthy
      media:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9091/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # MCP Server
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    container_name: facelesspro-mcp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://faceless:faceless@postgres:5432/faceless
      PGBOSS_SCHEMA: pgboss
      # The MCP server forwards tool calls to the api over the compose network.
      # `localhost` here would be the mcp container itself, so every tool call
      # would fail with ECONNREFUSED.
      API_BASE_URL: http://api:3001
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: facelesspro-web
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  data:
  media-data: