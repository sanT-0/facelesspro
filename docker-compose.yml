services:
  postgres:
    image: postgres:16-alpine
    container_name: stickman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stickman
      POSTGRES_PASSWORD: stickman
      POSTGRES_DB: stickman
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stickman -d stickman"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
